<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사이트 편집기 · __SITE__</title>
<script src="/static/i18n.js"></script>
<style>
  :root {
    --bg: #f4f6f9; --panel: #ffffff; --fg: #16181d; --muted: #5b6270; --border: #e1e4ea;
    --accent: #2f6fed; --accent-soft: #e8f0fd; --ok: #1a7f37; --ok-soft: #e6f4ea; --bad: #c62828; --bad-soft: #fdecea;
    --warn-soft: #fff6e0; --radius: 10px; color-scheme: light;
    font-family: "Pretendard", "Noto Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --panel: #161920; --fg: #e8eaee; --muted: #9aa2b1; --border: #2a2f39;
      --accent: #6ea8ff; --accent-soft: #17243a; --ok: #4ac26b; --ok-soft: #12261a; --bad: #ff7b72; --bad-soft: #2d1414;
      --warn-soft: #2b2410; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-size: 14px; height: 100vh; display: flex; flex-direction: column; }
  button, input, textarea, select { font: inherit; color: inherit; }
  header { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0 10px 0 0; white-space: nowrap; }
  header .status { color: var(--muted); font-size: 13px; margin-right: auto; }
  .btn { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); cursor: pointer; font-weight: 600; white-space: nowrap; }
  .btn:hover { background: var(--bg); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { color: var(--bad); }
  .btn.small { height: 27px; padding: 0 9px; font-size: 12.5px; font-weight: 500; }
  .btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  main { flex: 1; display: grid; grid-template-columns: minmax(360px, 40%) 1fr; min-height: 0; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } #previewPane { min-height: 70vh; } }
  #side { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); }
  .tabs { display: flex; gap: 2px; padding: 6px 10px 0; background: var(--panel); border-bottom: 1px solid var(--border); }
  .tab { border: 0; background: none; padding: 8px 11px; border-bottom: 2px solid transparent; cursor: pointer; color: var(--muted); font-weight: 600; }
  .tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
  .pane { flex: 1; overflow: auto; padding: 12px 14px 60px; }
  .pane[hidden] { display: none; }
  details.sec, .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; }
  details.sec > summary { padding: 10px 13px; cursor: pointer; font-weight: 700; list-style: none; display: flex; justify-content: space-between; }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary .count { color: var(--muted); font-weight: 500; font-size: 12.5px; }
  .sec-body, .card-body { padding: 4px 13px 12px; }
  .card h3 { margin: 0; padding: 10px 13px 0; font-size: 13.5px; }
  .field { margin: 9px 0; }
  .field > label, .label { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
  input[type=text], input[type=url], input[type=number], input[type=password], textarea, select.in { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 7px; background: var(--bg); }
  textarea { resize: vertical; min-height: 52px; line-height: 1.5; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .bi { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .bi .lang { font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 2px; display: block; }
  @media (max-width: 1200px) { .bi { grid-template-columns: 1fr; } }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .grid4 small { display: block; color: var(--muted); font-size: 11px; text-align: center; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .row > input[type=range] { flex: 1; }
  .unit { color: var(--muted); font-size: 12px; }
  .item { border: 1px solid var(--border); border-radius: 9px; margin: 8px 0; background: var(--panel); }
  .item > .item-head { display: flex; align-items: center; gap: 6px; padding: 5px 8px 5px 11px; border-bottom: 1px solid var(--border); background: var(--bg); border-radius: 9px 9px 0 0; }
  .item > .item-head .title { flex: 1; font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .item > .item-body { padding: 2px 11px 10px; }
  .item.collapsed > .item-body { display: none; }
  .icon { width: 27px; height: 27px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); cursor: pointer; font-size: 13px; line-height: 1; }
  .strlist .srow { display: flex; gap: 6px; margin: 4px 0; }
  .check { display: flex; gap: 8px; align-items: center; }
  .img-field { display: grid; grid-template-columns: 88px 1fr; gap: 10px; align-items: start; }
  .thumb { width: 88px; height: 66px; border-radius: 7px; border: 1px dashed var(--border); object-fit: cover; background: var(--bg); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 11px; }
  #previewPane { display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
  .pv-bar { display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; }
  .pv-bar .note { color: var(--muted); font-size: 12.5px; margin-right: auto; }
  .frame-wrap { flex: 1; display: flex; justify-content: center; overflow: auto; }
  iframe { border: 0; width: 100%; height: 100%; background: #fff; }
  .frame-wrap.mobile iframe { width: 390px; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
  .steps { margin: 6px 0 0; padding-left: 20px; line-height: 1.75; }
  .steps b { color: var(--accent); }
  .selname { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; background: var(--bg); padding: 2px 6px; border-radius: 5px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: var(--panel); padding: 5px 10px; cursor: pointer; font-size: 12.5px; }
  .seg button.on { background: var(--accent); color: #fff; }
  .rule { font-family: ui-monospace, Consolas, monospace; font-size: 12px; border-bottom: 1px solid var(--border); padding: 6px 0; display: flex; gap: 6px; align-items: flex-start; }
  .rule .sel { flex: 1; word-break: break-all; }
  .rule .sel small { color: var(--muted); display: block; }
  .files-list button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
  .files-list button:hover, .files-list button.on { background: var(--accent-soft); }
  .code { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; min-height: 360px; white-space: pre; tab-size: 2; }
  .hist { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .hist .meta { flex: 1; }
  .hist .meta small { color: var(--muted); display: block; }
  dialog { border: 1px solid var(--border); border-radius: 14px; padding: 0; width: min(940px, 95vw); max-height: 92vh; background: var(--panel); color: var(--fg); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .dlg-head { padding: 13px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .dlg-head h2 { margin: 0; font-size: 16px; }
  .dlg-body { padding: 13px 18px; overflow: auto; max-height: calc(92vh - 130px); }
  .dlg-foot { padding: 11px 18px; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
  pre.diff { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; overflow: auto; max-height: 50vh; font-size: 12px; line-height: 1.45; margin: 8px 0; }
  .add-l { background: var(--ok-soft); color: var(--ok); display: block; }
  .del-l { background: var(--bad-soft); color: var(--bad); display: block; }
  .hunk { color: var(--accent); display: block; }
  .banner { padding: 9px 12px; border-radius: 8px; margin: 8px 0; }
  .banner.bad { background: var(--bad-soft); color: var(--bad); }
  .banner.warn { background: var(--warn-soft); }
  .banner.ok { background: var(--ok-soft); color: var(--ok); }
  .banner.info { background: var(--accent-soft); }
  .log { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; background: var(--bg); border-radius: 8px; padding: 10px; white-space: pre-wrap; }
  .menu { position: relative; }
  .menu-list { position: absolute; top: 36px; left: 0; z-index: 20; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 6px; min-width: 250px; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
  .menu-list button, .menu-check { display: flex; justify-content: space-between; gap: 12px; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 7px; cursor: pointer; font-size: 13.5px; align-items: center; }
  .menu-list button:hover, .menu-check:hover { background: var(--accent-soft); }
  .menu-list kbd { color: var(--muted); font-family: inherit; font-size: 12px; }
  .menu-list hr { border: 0; border-top: 1px solid var(--border); margin: 5px 0; }
  .menu-check { justify-content: flex-start; }
  a.btn { display: inline-flex; align-items: center; text-decoration: none; color: inherit; }
  .saved-ok { color: var(--ok); }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 9px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; }
  .toast.show { opacity: 1; }
  .muted { color: var(--muted); }
  .dirty-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #e3a008; margin-right: 6px; vertical-align: middle; }
  .tgt { display: flex; gap: 8px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .tgt .meta { flex: 1; }
  .tgt .meta small { color: var(--muted); display: block; word-break: break-all; }
  .pill { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: var(--bg); border: 1px solid var(--border); }
</style>
</head>
<body>
<header>
  <a class="btn" href="/" title="홈 (프로젝트 목록)" id="homeBtn">⌂</a>
  <h1><span id="projName" translate="no">__SITE__</span></h1>
  <div class="menu" id="fileMenu">
    <button class="btn" id="fileMenuBtn" aria-haspopup="true" aria-expanded="false">파일 ▾</button>
    <div class="menu-list" id="fileMenuList" hidden>
      <button data-m="home">홈 · 다른 프로젝트 열기 <kbd>⌂</kbd></button>
      <button data-m="save">저장 <kbd>Ctrl+S</kbd></button>
      <button data-m="saveas">다른 이름으로 저장(복제)…</button>
      <button data-m="rename">이름 바꾸기…</button>
      <hr>
      <button data-m="history">버전 기록 · 되돌리기</button>
      <button data-m="export">내보내기 (zip 내려받기)</button>
      <button data-m="reveal">탐색기에서 폴더 열기</button>
      <hr>
      <button data-m="deploy">배포…</button>
      <button data-m="targets">배포 대상(서버) 설정…</button>
      <hr>
      <label class="menu-check"><input type="checkbox" id="autoSave"> 자동 저장</label>
    </div>
  </div>
  <span class="status" id="status">불러오는 중…</span>
  <button class="btn" id="undoBtn" title="실행 취소 (Ctrl+Z)">↶</button>
  <button class="btn" id="redoBtn" title="다시 실행 (Ctrl+Y)">↷</button>
  <button class="btn" id="diffBtn">코드 변경 보기</button>
  <button class="btn" id="revertBtn">저장 전 변경 취소</button>
  <button class="btn primary" id="saveBtn" title="Ctrl+S">저장</button>
  <button class="btn" id="deployBtn">배포…</button>
  <span id="langSlot"></span>
</header>
<main>
  <section id="side">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-tab="design">디자인</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="content">내용</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="files">파일</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="history">되돌리기 기록</button>
    </div>
    <div class="pane" id="pane-design"></div>
    <div class="pane" id="pane-content" hidden></div>
    <div class="pane" id="pane-files" hidden>
      <p class="muted">HTML 구조나 CSS를 직접 고칠 때 씁니다. 저장할 때마다 되돌리기 기록이 남습니다.</p>
      <div class="files-list" id="fileList" translate="no"></div>
      <div id="fileEditor" hidden>
        <div class="field"><label id="fileLabel" translate="no"></label><textarea class="code" id="fileText" spellcheck="false"></textarea></div>
        <button class="btn primary small" id="fileSave">파일 저장</button>
        <button class="btn small danger" id="fileDiscard">배포된 상태로 되돌리기</button>
      </div>
    </div>
    <div class="pane" id="pane-history" hidden>
      <p class="muted">저장하기 전 상태가 자동으로 남습니다. 복원해도 지금 상태가 먼저 기록되므로 다시 되돌릴 수 있습니다.</p>
      <div id="histList"></div>
    </div>
  </section>
  <section id="previewPane">
    <div class="pv-bar">
      <select class="in" id="pageSel" style="width:auto" title="편집할 페이지"></select>
      <span class="note" id="pvNote">페이지에서 요소를 클릭하세요</span>
      <span class="seg"><button id="pvDesktop" class="on">데스크톱</button><button id="pvMobile">휴대폰</button></span>
      <button class="btn small" id="pvReload">새로고침</button>
    </div>
    <div class="frame-wrap" id="frameWrap"><iframe id="preview" title="사이트 편집 화면"></iframe></div>
  </section>
</main>

<dialog id="dlg"><div class="dlg-head"><h2 id="dlgTitle"></h2><button class="icon" data-close aria-label="닫기">✕</button></div>
  <div class="dlg-body" id="dlgBody"></div><div class="dlg-foot" id="dlgFoot"></div></dialog>
<div class="toast" id="toast"></div>

<script>
"use strict";
const TOKEN = "__TOKEN__";
const BASE = "__BASE__";                 // /p/<project id>
const PID = BASE.split("/")[2];
const API = "/api" + BASE;
const FONT_IMPORTS = { "Noto Sans KR": "Noto+Sans+KR:wght@400;500;700", "Nanum Gothic": "Nanum+Gothic:wght@400;700",
  "Nanum Myeongjo": "Nanum+Myeongjo:wght@400;700", "Gowun Dodum": "Gowun+Dodum", "IBM Plex Sans KR": "IBM+Plex+Sans+KR:wght@400;500;700",
  "Inter": "Inter:wght@400;500;700", "Playfair Display": "Playfair+Display:wght@400;700" };
const FONTS = [["", "그대로"], ["Pretendard, 'Noto Sans KR', sans-serif", "Pretendard"], ["'Noto Sans KR', sans-serif", "Noto Sans KR"],
  ["'Nanum Gothic', sans-serif", "나눔고딕"], ["'Nanum Myeongjo', serif", "나눔명조"], ["'Gowun Dodum', sans-serif", "고운돋움"],
  ["'IBM Plex Sans KR', sans-serif", "IBM Plex Sans KR"], ["Inter, sans-serif", "Inter"], ["'Playfair Display', serif", "Playfair Display"],
  ["Georgia, serif", "Georgia (serif)"], ["ui-monospace, Consolas, monospace", "고정폭"]];
const $ = (s, r = document) => r.querySelector(s);
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));

// ---------- state ----------
const S = { data: null, name: "SITE", rules: [], html: [], contentAvailable: false };
let saved = { data: null, rules: [] };
let undo = [], redo = [], gesture = false, page = "index.html", media = "", scope = "one", sel = null, editingText = false;
let autosaveArmed = false, autosaveTimer = null, saving = false, lastSavedAt = null;
const AUTO_KEY = "se-autosave-" + PID;
let autoSaveOn = (() => { try { return localStorage.getItem(AUTO_KEY) !== "0"; } catch (e) { return true; } })();
let pendingReselect = null, draftTimer = null;

async function api(path, body) {
  return call(path.replace(/^\/api\//, API + "/"), body);
}
async function homeApi(path, body) { return call(path, body); }
async function call(path, body) {
  const opt = { headers: { "X-Editor-Token": TOKEN } };
  if (body !== undefined) { opt.method = "POST"; opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({ error: "bad response" }));
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2400); }
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "text") n.textContent = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  kids.flat().forEach(k => k != null && k !== false && n.append(k));
  return n;
}
const frame = () => $("#preview").contentWindow;
const bridge = () => { try { return frame().SEB; } catch (e) { return null; } };

function snapshot() { return JSON.stringify({ data: S.data, rules: S.rules, html: S.html }); }
function pushUndo() { undo.push(snapshot()); if (undo.length > 300) undo.shift(); redo = []; autosaveArmed = true; updateButtons(); }
function restoreSnap(s) { const o = JSON.parse(s); S.data = o.data; S.rules = o.rules; S.html = o.html; }
function isDirty() { return S.html.length > 0 || JSON.stringify(S.data) !== JSON.stringify(saved.data) || JSON.stringify(S.rules) !== JSON.stringify(saved.rules); }
function ago(t) {
  const s = Math.round((Date.now() - t) / 1000);
  return s < 10 ? "방금" : s < 60 ? `${s}초 전` : s < 3600 ? `${Math.round(s / 60)}분 전` : new Date(t).toLocaleTimeString().slice(0, -3);
}
function updateButtons() {
  const d = isDirty();
  const st = $("#status");
  if (saving) st.textContent = "저장 중…";
  else if (d) st.innerHTML = '<span class="dirty-dot"></span>' + (autoSaveOn ? "변경 사항 저장 대기 중…" : "저장하지 않은 변경 있음 (자동 저장 꺼짐)");
  else st.innerHTML = '<span class="saved-ok">✓ 모든 변경 저장됨</span>' + (lastSavedAt ? " · " + ago(lastSavedAt) : "") + " · 공개하려면 배포";
  $("#saveBtn").disabled = !d; $("#revertBtn").disabled = !d; $("#diffBtn").disabled = !d;
  $("#undoBtn").disabled = !undo.length; $("#redoBtn").disabled = !redo.length;
  scheduleAutosave();
}
setInterval(() => { if (!isDirty() && !saving) updateButtons(); }, 30000);
function scheduleAutosave() {
  clearTimeout(autosaveTimer);
  if (!autoSaveOn || !autosaveArmed || !isDirty()) return;
  autosaveTimer = setTimeout(() => {
    if (editingText || gesture || saving || document.querySelector("dialog[open]")) return scheduleAutosave();
    save(true);
  }, 1500);
}

// ---------- live CSS ----------
function cssText() {
  const fonts = new Set();
  S.rules.forEach(r => (r.props["font-family"] || "").split(",").forEach(f => { f = f.trim().replace(/^['"]|['"]$/g, ""); if (FONT_IMPORTS[f]) fonts.add(f); }));
  let css = fonts.size ? `@import url("https://fonts.googleapis.com/css2?${[...fonts].sort().map(f => "family=" + FONT_IMPORTS[f]).join("&")}&display=swap");\n` : "";
  const block = (rs, ind = "") => rs.map(r => `${ind}${r.selector} {\n${Object.entries(r.props).map(([k, v]) => `${ind}  ${k}: ${v};`).join("\n")}\n${ind}}`).join("\n");
  css += block(S.rules.filter(r => !r.media));
  const mob = S.rules.filter(r => r.media === "mobile");
  if (mob.length) css += `\n@media (max-width: 720px) {\n${block(mob, "  ")}\n}`;
  return css;
}
function applyLive() { const b = bridge(); if (b) b.applyCss(cssText()); }
function currentSelector() { return sel ? (scope === "kind" ? sel.selectorKind : sel.selectorOne) : null; }
function ruleFor(selector, m = media) { return S.rules.find(r => r.selector === selector && r.media === m); }
function mergeRule(selector, props) {
  let r = ruleFor(selector);
  if (!r) { r = { selector, media, props: {} }; S.rules.push(r); }
  for (const [k, v] of Object.entries(props)) { if (v === "" || v == null) delete r.props[k]; else r.props[k] = v; }
  if (!Object.keys(r.props).length) S.rules = S.rules.filter(x => x !== r);

  const box = el("div");
  const inp = (k, label, attrs = {}) => { const i = el("input", Object.assign({ type: "text", value: v[k] ?? "" }, attrs)); i.oninput = () => v[k] = i.type === "checkbox" ? i.checked : i.value; if (attrs.type === "checkbox") { i.checked = !!v[k]; i.onchange = () => v[k] = i.checked; return el("label", { class: "check field" }, i, label); } return el("div", { class: "field" }, el("label", { text: label }), i); };
  const pw = el("input", { type: "password", autocomplete: "new-password", placeholder: t && t.has_password ? "저장됨 (바꿀 때만 입력)" : "" });
  function draw() {
    v.type = typeSel.value; box.innerHTML = "";
    box.append(inp("name", "이름 (예: 학교 서버)"), inp("site_url", "공개 주소 (배포 후 확인용, 예: https://example.com/)"));
    if (v.type === "sftp" || v.type === "ftp") {
      box.append(el("div", { class: "grid2" }, inp("host", "서버 주소 (호스트)"), inp("port", "포트", { type: "number", placeholder: v.type === "sftp" ? "22" : "21" })),
        el("div", { class: "grid2" }, inp("user", "사용자 이름"), inp("remote_path", "서버의 사이트 폴더 (예: /var/www/html)")));
    }
    if (v.type === "sftp") {
      const auth = el("select", { class: "in" }, [["key", "키 파일 (권장)"], ["password", "비밀번호"]].map(([a, l]) => el("option", { value: a, text: l })));
      auth.value = v.auth; auth.onchange = () => { v.auth = auth.value; draw(); };
      box.append(el("div", { class: "field" }, el("label", { text: "로그인 방법" }), auth));
      if (v.auth === "key") box.append(inp("key_file", "개인 키 파일 경로 (예: C:/Users/나/.ssh/id_ed25519)"), el("div", { class: "field" }, el("label", { text: "키 암호 (있을 때만)" }), pw));
      else box.append(el("div", { class: "field" }, el("label", { text: "비밀번호" }), pw));
      box.append(el("p", { class: "muted", style: "font-size:12px", text: "처음 접속할 때 서버 지문을 자동으로 기억합니다(accept-new). 이 PC의 OpenSSH(sftp)를 씁니다." }));
    }
    if (v.type === "ftp") box.append(el("div", { class: "field" }, el("label", { text: "비밀번호" }), pw), inp("tls", "암호화(FTPS) 사용 — 권장", { type: "checkbox" }), inp("passive", "패시브 모드", { type: "checkbox" }));
    if (v.type === "folder") box.append(inp("folder", "복사할 폴더 (예: Z:/www 또는 D:/backup/site)"));
    if (v.type === "git") box.append(el("p", { class: "muted", text: "사이트 폴더가 git 저장소이면 자동으로 만들어집니다. 원격(origin)으로 push 합니다." }));
  }
  typeSel.onchange = draw; draw();
  body.append(el("div", { class: "field" }, el("label", { text: "서버 종류" }), typeSel), box);
  foot.append(el("button", { class: "btn", text: "뒤로", onclick: () => manageTargets(after) }), el("button", { class: "btn primary", text: "저장", onclick: async () => {
    try { const payload = Object.assign({}, v, { id: t ? t.id : undefined, password: pw.value || undefined }); pw.value = "";
      await api("/api/targets", payload); toast("저장했습니다. '접속 시험'으로 확인해 보세요"); manageTargets(after); }
    catch (e) { body.prepend(el("div", { class: "banner bad", text: e.message })); }
  } }));
}

// ---------- deploy ----------
let lastTarget = null;
async function openDeploy() {
  const [body, foot] = openDialog("배포 — 공개 사이트에 올리기");
  let ts; try { ts = (await api("/api/targets")).targets; } catch (e) { body.append(el("div", { class: "banner bad", text: e.message })); return; }
  if (!ts.length) { body.append(el("p", { text: "아직 배포 대상이 없습니다. 서버를 먼저 등록하세요." })); foot.append(el("button", { class: "btn primary", text: "배포 대상 추가", onclick: () => manageTargets(openDeploy) })); return; }
  if (!ts.find(t => t.id === lastTarget)) lastTarget = ts[0].id;
  const tsel = el("select", { class: "in", style: "width:auto" }, ts.map(t => el("option", { value: t.id, text: `${t.name} — ${TYPE_LABEL[t.type]}` })));
  tsel.value = lastTarget;
  tsel.onchange = () => { lastTarget = tsel.value; openDeploy(); };
  body.append(el("div", { class: "row" }, el("span", { class: "label", style: "margin:0", text: "올릴 곳" }), tsel, el("button", { class: "btn small", text: "배포 대상 관리", onclick: () => manageTargets(openDeploy) })));
  if (isDirty()) body.append(el("div", { class: "banner warn", text: "저장하지 않은 변경이 있습니다. 저장한 것만 배포됩니다." }));
  const target = ts.find(t => t.id === lastTarget);
  let r; try { r = await api("/api/review?target=" + encodeURIComponent(lastTarget)); } catch (e) { body.append(el("div", { class: "banner bad", text: "비교 실패: " + e.message })); return; }
  body.append(el("p", { class: "muted" }, "주소: ", el("strong", { text: r.repo.site_url || target.site_url || "-" }), "   ·   위치: " + (r.repo.remote || "-")));
  const rollbackBtn = el("button", { class: "btn danger", text: "직전 배포 되돌리기", onclick: () => doRollback(target) });
  if (!r.files.length) {
    body.append(el("div", { class: "banner ok", text: "올릴 변경이 없습니다. 공개 사이트가 이미 최신입니다." }));
    foot.append(target.type === "git" || r.can_rollback ? rollbackBtn : null, el("button", { class: "btn", "data-close": "", text: "닫기" }));
    return;
  }
  if (r.first_deploy) body.append(el("div", { class: "banner info", text: "이 서버에 처음 올립니다. 서버에 같은 이름의 파일이 있으면 먼저 내려받아 백업한 뒤 덮어씁니다." }));
  if (r.unpushed_commits && r.unpushed_commits.length) body.append(el("div", { class: "banner warn" }, "아직 올라가지 않은 커밋도 함께 올라갑니다: ", r.unpushed_commits.join(" · ")));
  body.append(el("div", { class: "label", text: `바뀐 파일 ${r.files.length}개` }),
    el("ul", {}, r.files.slice(0, 200).map(f => el("li", {}, el("code", { text: f.path }), el("span", { class: "muted", text: "  " + ({ added: "새 파일", modified: "수정", deleted: "삭제" }[f.status] || f.status) })))));
  if (r.diff) body.append(el("div", { class: "label", text: "바뀐 내용 (초록 = 추가, 빨강 = 삭제)" }), diffView(r.diff));
  if (r.diff_truncated) body.append(el("div", { class: "banner warn", text: "변경이 너무 커서 앞부분만 보여 줍니다." }));
  const blocked = r.secrets.length > 0;
  if (blocked) body.append(el("div", { class: "banner bad" }, "비밀값으로 보이는 내용이 있어 배포를 막았습니다: ", r.secrets.map(s => `${s.path} (${s.kind})`).join(", ")));
  const msg = el("input", { type: "text", placeholder: "무엇을 바꿨는지 한 줄 (예: 제목 글꼴·크기 변경)" });
  const agree = el("input", { type: "checkbox", id: "agree" });
  body.append(el("div", { class: "field" }, el("label", { text: "변경 설명" }), msg), el("label", { class: "check", for: "agree" }, agree, "위 변경을 공개 사이트에 올리는 것을 확인했습니다"));
  const go = el("button", { class: "btn primary", text: "배포하기", disabled: true });
  agree.onchange = () => go.disabled = blocked || !agree.checked;
  go.onclick = async () => {
    go.disabled = true; agree.disabled = true;
    try { await api("/api/deploy", { target: lastTarget, confirm: true, change_id: r.change_id, message: msg.value }); }
    catch (e) { body.append(el("div", { class: "banner bad", text: "시작하지 못했습니다: " + e.message })); return; }
    watchJob(body, foot, "배포");
  };
  foot.append(target.type === "git" || r.can_rollback ? rollbackBtn : null, el("button", { class: "btn", "data-close": "", text: "취소" }), go);
}
async function doRollback(target) {
  const what = target.type === "git" ? "마지막 커밋을 되돌리는 커밋을 만들어 push 합니다" : "직전 배포 때 백업한 서버 파일을 다시 올리고, 그때 새로 올린 파일은 지웁니다";
  if (!confirm(`${target.name}: 직전 배포를 되돌릴까요?\n${what}.`)) return;
  const [body, foot] = openDialog("직전 배포 되돌리기");
  try { await api("/api/rollback", { target: target.id, confirm: true }); } catch (e) { body.append(el("div", { class: "banner bad", text: e.message })); foot.append(el("button", { class: "btn", "data-close": "", text: "닫기" })); return; }
  watchJob(body, foot, "되돌리기");
}
function watchJob(body, foot, what) {
  const log = el("div", { class: "log", translate: "no", text: T(what + " 중…") }); body.append(el("div", { class: "label", text: "진행 상황" }), log); log.scrollIntoView({ block: "end" });
  foot.innerHTML = "";
  const poll = async () => {
    const j = await api("/api/job");
    log.textContent = (j.log || []).join("\n") || what + " 중…";
    if (j.state === "running") return setTimeout(poll, 1500);
    if (j.state === "failed") body.append(el("div", { class: "banner bad", text: "실패: " + j.error }));
    else if (j.result) {
      const ok = j.result.ok;
      body.append(el("div", { class: "banner " + (ok ? "ok" : "warn") }, ok ? `${what} 완료 · 공개 사이트 파일이 올린 내용과 같은 것을 확인했습니다. ` : `${what}은 끝났지만 공개 사이트가 아직 다릅니다(캐시일 수 있음). 잠시 뒤 다시 확인하세요. `,
        j.result.site_url ? el("a", { href: j.result.site_url, target: "_blank", rel: "noopener", text: "사이트 열기 ↗" }) : null));
      (j.result.verified || []).forEach(v => body.append(el("div", { class: "muted", style: "font-size:12px", text: `${v.match ? "✓" : "✗"} ${v.url}` })));
    }
    foot.append(el("button", { class: "btn", "data-close": "", text: "닫기" }));
    loadHistory();
  };
  poll();
}
$("#deployBtn").onclick = openDeploy;

loadAll().catch(e => { $("#status").textContent = "불러오기 실패: " + e.message; });
</script>
